# This rule is not used by the project go-k8s-operator-sdk itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to storage.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: go-k8s-operator-sdk
    app.kubernetes.io/managed-by: kustomize
  name: managedbucket-viewer-role
rules:
- apiGroups:
  - storage.example.com
  resources:
  - managedbuckets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.example.com
  resources:
  - managedbuckets/status
  verbs:
  - get
