# This rule is not used by the project go-k8s-operator-sdk itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over storage.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: go-k8s-operator-sdk
    app.kubernetes.io/managed-by: kustomize
  name: managedbucket-admin-role
rules:
- apiGroups:
  - storage.example.com
  resources:
  - managedbuckets
  verbs:
  - '*'
- apiGroups:
  - storage.example.com
  resources:
  - managedbuckets/status
  verbs:
  - get
