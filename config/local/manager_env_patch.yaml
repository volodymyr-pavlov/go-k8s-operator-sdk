- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: AWS_ENDPOINT_URL
      value: http://s3-emulator:4566
    - name: AWS_ACCESS_KEY_ID
      value: test
    - name: AWS_SECRET_ACCESS_KEY
      value: test
    - name: AWS_REGION
      value: eu-central-1
- op: add
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: IfNotPresent
