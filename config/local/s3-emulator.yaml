apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-emulator
  labels:
    app.kubernetes.io/name: s3-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-emulator
    spec:
      containers:
        - name: s3-emulator
          image: floci/floci@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
          ports:
            - containerPort: 4566
          readinessProbe:
            tcpSocket:
              port: 4566
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: s3-emulator
spec:
  selector:
    app.kubernetes.io/name: s3-emulator
  ports:
    - port: 4566
      targetPort: 4566
